<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI KhangPhan - Chat</title>
    <style>
        :root {
            --bg-color: #131314;
            --sidebar-bg: #1e1f20;
            --text-color: #e3e3e3;
            --input-bg: #1e1f20;
            --border-color: #333537;
            --hover-color: #2b2c2d;
            --accent-color: #8ab4f8;
        }

        .light-mode {
            --bg-color: #ffffff;
            --sidebar-bg: #f0f4f9;
            --text-color: #1f1f1f;
            --input-bg: #f0f4f9;
            --border-color: #d1d5db;
            --hover-color: #e2e8f0;
            --accent-color: #1a73e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Sử dụng 100dvh để tự động co giãn khi bàn phím di động xuất hiện */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100dvh; 
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
            border-right: 1px solid var(--border-color);
        }

        .sidebar.hidden {
            transform: translateX(-260px);
            position: absolute;
            height: 100%;
        }

        .sidebar-header {
            padding: 16px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 16px;
            background-color: var(--hover-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-color);
        }

        .chat-item:hover {
            background-color: var(--hover-color);
        }

        /* Main Chat Area */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            background-color: var(--bg-color);
        }

        .chat-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-toggle, .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
        }

        .menu-toggle:hover, .theme-toggle:hover {
            background-color: var(--hover-color);
        }

        /* Khung chứa nội dung chat */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            /* Đảm bảo nội dung không bị khung nhập che khuất */
            padding-bottom: 90px; 
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
        }

        .message.user {
            background-color: var(--hover-color);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background-color: transparent;
            align-self: flex-start;
        }

        /* === PHẦN QUAN TRỌNG ĐỂ KHUNG CHAT TRỒI LÊN KHI BẬT BÀN PHÍM === */
        .chat-input-container {
            position: sticky;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-color);
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
        }

        .input-box-wrapper {
            display: flex;
            align-items: flex-end;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 8px 12px;
            gap: 8px;
        }

        .chat-textarea {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 15px;
            resize: none;
            max-height: 150px;
            outline: none;
            padding: 4px 0;
        }

        .send-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Responsive cho Mobile */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                height: 100%;
                left: 0;
                top: 0;
            }
            .sidebar.hidden {
                transform: translateX(-100%);
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="newChat()">
                <span>+</span> Đoạn chat mới
            </button>
        </div>
        <div class="chat-list" id="chatList">
            <!-- Lịch sử chat mẫu -->
            <div class="chat-item">Đoạn chat gần đây 1</div>
            <div class="chat-item">Lập trình web với AI</div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <div class="chat-header">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <span style="font-weight: 600;">AI KhangPhan</span>
            <div style="margin-left: auto;">
                <button class="theme-toggle" onclick="toggleTheme()">💡</button>
            </div>
        </div>

        <!-- Khung tin nhắn -->
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">Chào bạn! Tôi có thể giúp gì cho bạn hôm nay?</div>
            <div class="message user">Hãy giúp tôi chỉnh sửa giao diện nhé.</div>
            <div class="message bot">Được chứ! Khung nhập liệu ở dưới sẽ tự động trồi lên khi bàn phím điện thoại mở lên nhờ thuộc tính `position: sticky` kết hợp với `100dvh`.</div>
        </div>

        <!-- Khung nhập tin nhắn (Dính ở đáy màn hình và tự trồi lên khi bàn phím hiện) -->
        <div class="chat-input-container">
            <div class="input-box-wrapper">
                <textarea class="chat-textarea" id="chatTextarea" placeholder="Nhập tin nhắn..." rows="1" oninput="autoResize(this)"></textarea>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // Tự động co giãn textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // Ẩn hiện Sidebar
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
        }

        // Đổi giao diện Sáng/Tối
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }

        // Khôi phục theme đã lưu
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        function newChat() {
            alert('Tạo đoạn chat mới!');
        }

        function sendMessage() {
            const input = document.getElementById('chatTextarea');
            if (!input.value.trim()) return;
            
            const messagesContainer = document.getElementById('chatMessages');
            
            // Thêm tin nhắn người dùng
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = input.value;
            messagesContainer.appendChild(userMsg);

            input.value = '';
            input.style.height = 'auto';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    </script>
</body>
</html>
