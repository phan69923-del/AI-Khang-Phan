<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI KhangPhan - Dashboard</title>
    <!-- Nhúng file logo.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='logo.css') }}?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            height: 100vh;
        }
        #sidebar {
            width: 260px;
            background-color: #181818;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid #2d2d2d;
        }
        .sidebar-logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 4px;
            margin-bottom: 20px;
        }
        .sidebar-logo-container span {
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
        }
        .new-chat-btn {
            width: 100%;
            padding: 10px;
            background-color: #2b2c2d;
            border: 1px solid #3d3d3d;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .new-chat-btn:hover {
            background-color: #38393a;
        }
        .main-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-top">
            <!-- Khối chứa Logo đã kết nối class từ logo.css -->
            <div class="sidebar-logo-container">
                <img src="{{ url_for('static', filename='logo.png') }}" class="sidebar-logo-img" alt="Logo">
                <span>AI KhangPhan</span>
            </div>

            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-plus"></i> Cuộc trò chuyện mới
            </button>
        </div>

        <div class="chat-history" id="chatHistory">
            <div class="history-item active">
                <i class="fa-regular fa-message"></i>
                <span class="history-text">Đoạn chat mẫu đầu tiên</span>
            </div>
        </div>

        <div class="sidebar-footer">
            <!-- Thông tin footer nếu có -->
        </div>
    </div>

    <div class="main-content">
        <h1>Chào mừng đến với AI KhangPhan</h1>
    </div>

    <script>
        function startNewChat() {
            console.log("Tạo chat mới...");
        }
    </script>
</body>
</html>
