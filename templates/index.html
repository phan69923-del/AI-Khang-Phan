<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI KhangPhan Chat</title>
    <style>
        /* CSS cơ bản cho giao diện chat và bảng bảo trì */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #maintenance-banner {
            background-color: #ffcc00;
            color: #333;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            display: none;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 20px auto;
            width: 100%;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 5px;
            max-width: 70%;
            word-wrap: break-word;
        }
        .message.user {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
        }
        .message.bot {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #f1f1f1;
            border-top: 1px solid #ddd;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        .chat-input-area button {
            padding: 10px 20px;
            margin-left: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .chat-input-area button:hover {
            background-color: #0056b3;
        }
        /* Modal bảo trì khẩn cấp */
        #emergency-maintenance-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .modal-content h3 {
            color: #d9534f;
            margin-top: 0;
        }
        .modal-content button {
            padding: 10px 20px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
        .modal-content button:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

    <!-- Banner đếm ngược bảo trì định kỳ -->
    <div id="maintenance-banner">
        ⚠️ Hệ thống sẽ tiến hành bảo trì trong vòng <span id="banner-countdown">00:00</span> phút tới!
    </div>

    <!-- Khung giao diện Chat -->
    <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
            <!-- Tin nhắn sẽ được render ở đây -->
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Nhập tin nhắn của bạn..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <!-- Bảng thông báo bảo trì khẩn cấp (Bật/Tắt dựa vào true/false từ server) -->
    <div id="emergency-maintenance-modal">
        <div class="modal-content">
            <h3>⚠️ THÔNG BÁO BẢO TRÌ KHẨN CẤP</h3>
            <p>Hệ thống đang tạm ngưng hoạt động đột xuất để nâng cấp máy chủ. Vui lòng quay lại sau ít phút!</p>
            <button onclick="handleMaintenanceOk()">Đồng ý / Chuyển hướng</button>
        </div>
    </div>

    <script>
        // Khởi tạo biến lưu trữ phiên chat giả lập
        let currentChatId = 'default';
        let sessions = {
            'default': {
                messages: [
                    { role: 'bot', text: 'Xin chào! Tôi là trợ lý ảo AI KhangPhan. Tôi có thể giúp gì cho bạn?' }
                ]
            }
        };

        // Hàm render danh sách tin nhắn ra màn hình
        function renderSessions(currentSessions) {
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML = '';
            
            if (currentSessions[currentChatId] && currentSessions[currentChatId].messages) {
                currentSessions[currentChatId].messages.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${msg.role}`;
                    msgDiv.textContent = msg.text;
                    chatMessages.appendChild(msgDiv);
                });
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Bắt sự kiện nhấn Enter để gửi tin nhắn
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Hàm gửi tin nhắn đi
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            const chatMessages = document.getElementById('chat-messages');

            // 1. Hiển thị tin nhắn của user
            sessions[currentChatId].messages.push({ role: 'user', text: messageText });
            renderSessions(sessions);
            inputField.value = '';

            // 2. Tạo khung tin nhắn chờ phản hồi từ Bot
            const botMsg = document.createElement('div');
            botMsg.className = 'message bot';
            botMsg.textContent = "AI KhangPhan đang suy nghĩ...";
            chatMessages.appendChild(botMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // Gọi API backend (ví dụ đường dẫn /chat)
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText, session_id: currentChatId })
                });

                if (!response.ok) {
                    throw new Error(`Lỗi máy chủ: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.response) {
                    botMsg.textContent = data.response;
                    sessions[currentChatId].messages.push({ role: 'bot', text: data.response });
                } else {
                    botMsg.textContent = "Xin lỗi, tôi không nhận được phản hồi từ hệ thống.";
                    sessions[currentChatId].messages.push({ role: 'bot', text: botMsg.textContent });
                }

                if (data.sessions) {
                    sessions = data.sessions;
                }

                renderSessions(sessions);

            } catch (error) {
                console.error("Lỗi khi chat:", error);
                botMsg.textContent = "⚠️ Lỗi kết nối hoặc lỗi xử lý từ máy chủ AI KhangPhan!";
                sessions[currentChatId].messages.push({ role: 'bot', text: botMsg.textContent });
            }
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ================= LOGIC BẢO TRÌ & ĐẾM NGƯỢC TỰ ĐỘNG =================

        // 1. Kiểm tra trạng thái bảo trì đột xuất từ server mỗi 5 giây (Xử lý true/false để ẩn/hiện bảng)
        setInterval(function() {
            fetch('/check-maintenance')
                .then(response => response.json())
                .then(data => {
                    var emergencyModal = document.getElementById('emergency-maintenance-modal');
                    
                    if (emergencyModal) {
                        if (data.is_maintenance === true) {
                            emergencyModal.style.display = 'flex'; // Hiện bảng bảo trì khi true
                        } else {
                            emergencyModal.style.display = 'none';  // Ẩn bảng bảo trì khi false
                        }
                    }
                })
                .catch(error => console.log('Lỗi kiểm tra bảo trì:', error));
        }, 5000);

        function handleMaintenanceOk() {
            window.location.href = "/maintenance";
        }

        // 2. Logic đếm ngược và tự động chuyển sang trang bảo trì khi hết giờ
        var bannerCacheKey = "maintenance_end_v1";  
        var targetTime = localStorage.getItem(bannerCacheKey);

        // Nếu chưa có thời gian, tự động tạo 2 phút để test
        if (!targetTime) {
            targetTime = new Date().getTime() + (2 * 60 * 1000);  
            localStorage.setItem(bannerCacheKey, targetTime);
        }

        if (targetTime) {
            var bannerInterval = setInterval(function() {
                var now = new Date().getTime();
                var distance = targetTime - now;

                if (distance > 0) {
                    var banner = document.getElementById('maintenance-banner');
                    if (banner) {
                        banner.style.display = 'block';
                    }

                    var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    var seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    
                    var countdownEl = document.getElementById('banner-countdown');
                    if (countdownEl) {
                        // Chuẩn hóa hiển thị luôn có 2 chữ số (VD: 02:05)
                        var formattedMinutes = String(minutes).padStart(2, '0');
                        var formattedSeconds = String(seconds).padStart(2, '0');
                        countdownEl.innerHTML = formattedMinutes + ":" + formattedSeconds;
                    }
                } else {
                    // Hết giờ trên banner -> Xóa cache và chuyển sang trang bảo trì
                    clearInterval(bannerInterval);
                    localStorage.removeItem(bannerCacheKey);
                    
                    var maintenanceDurationMinutes = 5; 
                    var maintenanceEndTime = new Date().getTime() + (maintenanceDurationMinutes * 60 * 1000);
                    localStorage.setItem('maintenance_end_time', maintenanceEndTime);
                    
                    window.location.href = "/maintenance"; 
                }
            }, 1000);
        }

        // Khởi chạy render danh sách chat ban đầu
        renderSessions(sessions);
    </script>
</body>
</html>
