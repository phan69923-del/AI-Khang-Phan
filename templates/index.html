<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI KhangPhan - Trợ lý ảo thông minh</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Light Mode Styles */
        body.light-mode {
            background-color: #ffffff;
            color: #1f1f1f;
        }
        body.light-mode .sidebar {
            background-color: #f0f4f9;
            border-right: 1px solid #e0e0e0;
        }
        body.light-mode .sidebar-logo-container span,
        body.light-mode .new-chat-btn,
        body.light-mode .chat-header,
        body.light-mode .menu-toggle-btn {
            color: #1f1f1f;
        }
        body.light-mode .new-chat-btn {
            background-color: #e2e7eb;
        }
        body.light-mode .new-chat-btn:hover {
            background-color: #d3dbdf;
        }
        body.light-mode .history-item {
            color: #444746;
        }
        body.light-mode .history-item:hover,
        body.light-mode .history-item.active {
            background-color: #e2e7eb;
        }
        body.light-mode .sidebar-footer {
            border-top: 1px solid #e0e0e0;
            color: #5f6368;
        }
        body.light-mode .footer-btn {
            background-color: #e2e7eb;
            color: #1f1f1f;
        }
        body.light-mode .footer-btn:hover {
            background-color: #d3dbdf;
        }
        body.light-mode .message.user {
            background-color: #f0f4f9;
            color: #1f1f1f;
        }
        body.light-mode .message.bot {
            background-color: #ffffff;
            color: #1f1f1f;
            border: 1px solid #e0e0e0;
        }
        body.light-mode .chat-input-container {
            background-color: #ffffff;
        }
        body.light-mode .chat-input-box {
            background-color: #f0f4f9;
            border: 1px solid #c4c7c5;
        }
        body.light-mode .chat-input-box textarea {
            color: #1f1f1f;
        }
        body.light-mode .send-btn {
            color: #0b57d0;
        }
        body.light-mode .send-btn:hover {
            background-color: #e2e7eb;
        }

        .sidebar {
            width: 260px;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1000;
            transition: transform 0.3s ease, background-color 0.3s;
        }

        .sidebar-top {
            padding: 16px;
        }

        .sidebar-logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 4px;
            margin-bottom: 20px;
        }

        .sidebar-logo-container img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        .sidebar-logo-container span {
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #1f1f1f;
            color: #ffffff;
            border: none;
            padding: 12px 16px;
            border-radius: 30px;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #2c2c2c;
        }

        .chat-history {
            padding: 0 16px;
            overflow-y: auto;
            flex: 1;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 20px;
            font-size: 14px;
            color: #cccccc;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }

        .history-item:hover, .history-item.active {
            background-color: #1f1f1f;
            color: #ffffff;
        }

        .history-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #1f1f1f;
            font-size: 13px;
            color: #aaaaaa;
        }

        .footer-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .footer-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #1f1f1f;
            color: #ffffff;
            border: none;
            padding: 8px 10px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .footer-btn:hover {
            background-color: #2c2c2c;
        }

        .main-chat {
            margin-left: 260px;
            width: calc(100% - 260px);
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #000000;
            transition: margin 0.3s ease, width 0.3s ease, background-color 0.3s;
        }

        .chat-header {
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            display: none;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            max-width: 75%;
            line-height: 1.6;
            font-size: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            background-color: #1f1f1f;
            align-self: flex-end;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background-color: #121212;
            align-self: flex-start;
            color: #ffffff;
            border: 1px solid #222222;
            border-bottom-left-radius: 4px;
        }

        .chat-input-container {
            padding: 20px 24px;
            background-color: #000000;
        }

        .chat-input-box {
            max-width: 900px;
            margin: 0 auto;
            background-color: #121212;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border: 1px solid #333333;
        }

        .chat-input-box textarea {
            flex: 1;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 120px;
            padding: 8px 0;
        }

        .send-btn {
            background: none;
            border: none;
            color: #8ab4f8;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background-color: #1f1f1f;
        }

        @media screen and (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.active {
                transform: translateX(0);
            }
            .main-chat {
                margin-left: 0 !important;
                width: 100% !important;
            }
            .menu-toggle-btn {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-logo-container">
                <img src="https://via.placeholder.com/28" alt="Logo">
                <span>AI KhangPhan</span>
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-plus"></i> Cuộc trò chuyện mới
            </button>
        </div>
        
        <div class="chat-history" id="chatHistory">
            <div class="history-item active">
                <i class="fa-regular fa-message"></i>
                <span class="history-text">Đoạn chat mẫu đầu tiên</span>
            </div>
        </div>

        <div class="sidebar-footer">
            <div>Trợ lý thông minh</div>
            <div class="footer-actions">
                <button class="footer-btn" onclick="toggleTheme()">
                    <i class="fa-solid fa-circle-half-stroke"></i> Giao diện
                </button>
            </div>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <button class="menu-toggle-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <span>Trò chuyện cùng AI KhangPhan</span>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                Chào bạn! Tôi có thể giúp gì cho bạn hôm nay?
            </div>
        </div>

        <div class="chat-input-container">
            <div class="chat-input-box">
                <textarea id="userInput" placeholder="Nhập tin nhắn..." rows="1" oninput="autoResize(this)" onkeydown="checkEnter(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function checkEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function startNewChat() {
            document.getElementById('chatMessages').innerHTML = `
                <div class="message bot">Chào bạn! Tôi có thể giúp gì cho bạn hôm nay?</div>
            `;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const messageText = input.value.trim();
            if (!messageText) return;

            const chatMessages = document.getElementById('chatMessages');
            
            // 1. Hiển thị tin nhắn của người dùng
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = messageText;
            chatMessages.appendChild(userMsg);

            input.value = '';
            input.style.height = 'auto';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // 2. Tạo khung tin nhắn chờ phản hồi từ AI
            const botMsg = document.createElement('div');
            botMsg.className = 'message bot';
            botMsg.textContent = "Đang suy nghĩ...";
            chatMessages.appendChild(botMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // Thay thế YOUR_API_KEY bằng API Key thật của bạn
                const apiKey = "YOUR_API_KEY"; 
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: messageText }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates.length > 0) {
                    const replyText = data.candidates[0].content.parts[0].text;
                    botMsg.textContent = replyText;
                } else {
                    botMsg.textContent = "Xin lỗi, tôi không nhận được phản hồi hợp lệ từ AI.";
                }
            } catch (error) {
                botMsg.textContent = "Lỗi kết nối! Vui lòng kiểm tra lại đường truyền hoặc API Key.";
            }
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
