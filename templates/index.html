<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI KhangPhan - Full Code Gộp Trọn Vẹn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
        }
        /* Banner thông báo đếm ngược bảo trì định kỳ */
        #maintenance-banner {
            display: none;
            background-color: #f59e0b;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        /* Giao diện chat chính */
        .chat-container {
            max-width: 600px;
            margin: 30px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .chat-messages {
            height: 350px;
            border: 1px solid #ddd;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .message.user {
            background: #dbeafe;
            align-self: flex-end;
        }
        .message.bot {
            background: #e2e8f0;
            align-self: flex-start;
        }
        .chat-input-box {
            display: flex;
            gap: 10px;
        }
        .chat-input-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        .chat-input-box button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .chat-input-box button:hover {
            background: #1d4ed8;
        }

        /* Modal bảo trì khẩn cấp (true/false) */
        #emergency-maintenance-modal {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-content h2 {
            color: #ef4444;
            margin-top: 0;
        }
        .modal-content button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        .modal-content button:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <!-- Banner bảo trì định kỳ -->
    <div id="maintenance-banner">
        ⚠️ Hệ thống sẽ tiến hành bảo trì định kỳ sau: <span id="banner-countdown">--:--</span>
    </div>

    <!-- Modal bảo trì khẩn cấp (Bật/Tắt bằng true/false) -->
    <div id="emergency-maintenance-modal">
        <div class="modal-content">
            <h2>🚨 THÔNG BÁO BẢO TRÌ KHẨN CẤP</h2>
            <p>Hệ thống đang được nâng cấp hoặc xử lý sự cố đột xuất. Vui lòng bấm bên dưới để sang trang bảo trì.</p>
            <button onclick="handleMaintenanceOk()">Đồng ý / Chuyển hướng</button>
        </div>
    </div>

    <!-- Khung giao diện chat -->
    <div class="chat-container">
        <h2>Trợ lý AI KhangPhan</h2>
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">Xin chào! Tôi có thể giúp gì cho bạn hôm nay?</div>
        </div>
        <div class="chat-input-box">
            <input type="text" id="user-input" placeholder="Nhập tin nhắn..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script>
        // Khởi tạo dữ liệu phiên chat mẫu
        var currentChatId = "chat_1";
        var sessions = {
            "chat_1": {
                messages: [{ role: 'bot', text: "Xin chào! Tôi có thể giúp gì cho bạn hôm nay?" }]
            }
        };

        var chatMessages = document.getElementById('chat-messages');

        function renderSessions(dataSessions) {
            console.log("Sessions updated:", dataSessions);
        }

        // ================= HÀM XỬ LÝ GỬI TIN NHẮN CHAT =================
        async function sendMessage() {
            var inputEl = document.getElementById('user-input');
            var text = inputEl.value.trim();
            if (!text) return;

            // Hiển thị tin nhắn người dùng
            var userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.textContent = text;
            chatMessages.appendChild(userMsgDiv);

            if (!sessions[currentChatId]) {
                sessions[currentChatId] = { messages: [] };
            }
            sessions[currentChatId].messages.push({ role: 'user', text: text });
            inputEl.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Tạo khung tin nhắn chờ từ bot
            var botMsg = document.createElement('div');
            botMsg.className = 'message bot';
            botMsg.textContent = "Đang suy nghĩ...";
            chatMessages.appendChild(botMsg);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                let response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatId: currentChatId, message: text })
                });

                if (!response.ok) {
                    throw new Error(`Lỗi máy chủ: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.response) {
                    botMsg.textContent = data.response;
                    sessions[currentChatId].messages.push({ role: 'bot', text: data.response });
                } else {
                    botMsg.textContent = "Xin lỗi, tôi không nhận được phản hồi từ hệ thống.";
                    sessions[currentChatId].messages.push({ role: 'bot', text: botMsg.textContent });
                }

                if (data.sessions) {
                    sessions = data.sessions;
                }

                renderSessions(sessions);

            } catch (error) {
                console.error("Lỗi khi chat:", error);
                botMsg.textContent = "⚠️ Lỗi kết nối hoặc lỗi xử lý từ máy chủ AI KhangPhan!";
                sessions[currentChatId].messages.push({ role: 'bot', text: botMsg.textContent });
            }
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // ================= LOGIC BẢO TRÌ & ĐẾM NGƯỢC TỰ ĐỘNG =================

        // 1. Kiểm tra trạng thái bảo trì đột xuất từ server mỗi 5 giây (Xử lý true / false)
        setInterval(function() {
            fetch('/check-maintenance')
                .then(response => response.json())
                .then(data => {
                    var modal = document.getElementById('emergency-maintenance-modal');
                    
                    // Nếu server trả về true -> Bật bảng bảo trì khẩn cấp
                    if (data.is_maintenance === true) {
                        if (modal) modal.style.display = 'flex';
                    } 
                    // Nếu server trả về false -> Ẩn bảng bảo trì đi để tiếp tục chat bình thường
                    else if (data.is_maintenance === false) {
                        if (modal) modal.style.display = 'none';
                    }
                })
                .catch(error => console.log('Lỗi kiểm tra bảo trì:', error));
        }, 5000);

        function handleMaintenanceOk() {
            window.location.href = "/maintenance";
        }

        // 2. Logic đếm ngược và tự động chuyển sang trang bảo trì khi hết giờ
        var bannerCacheKey = "maintenance_end_v1";  
        var targetTime = localStorage.getItem(bannerCacheKey);

        // Nếu chưa có thời gian, tự động tạo 2 phút để test
        if (!targetTime) {
            targetTime = new Date().getTime() + (2 * 60 * 1000);  
            localStorage.setItem(bannerCacheKey, targetTime);
        }

        if (targetTime) {
            var bannerInterval = setInterval(function() {
                var now = new Date().getTime();
                var distance = targetTime - now;

                if (distance > 0) {
                    var banner = document.getElementById('maintenance-banner');
                    if (banner) {
                        banner.style.display = 'block';
                    }

                    var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    var seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    
                    var countdownEl = document.getElementById('banner-countdown');
                    if (countdownEl) {
                        countdownEl.innerHTML = (minutes < 10 ? "0" : "") + minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
                    }
                } else {
                    // Hết giờ trên banner -> Xóa cache, lưu thời gian bảo trì rồi tự động chuyển trang
                    clearInterval(bannerInterval);
                    localStorage.removeItem(bannerCacheKey);
                    
                    var maintenanceDurationMinutes = 5; 
                    var maintenanceEndTime = new Date().getTime() + (maintenanceDurationMinutes * 60 * 1000);
                    localStorage.setItem('maintenance_end_time', maintenanceEndTime);
                    
                    window.location.href = "/maintenance"; 
                }
            }, 1000);
        }

        // Khởi chạy render danh sách chat ban đầu
        renderSessions(sessions);
    </script>
</body>
</html>
