<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI_KhangPhan - Đang bảo trì</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .maintenance-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #ffc107;
            margin-bottom: 15px;
            font-size: 26px;
        }
        p {
            color: #cfd8dc;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        #countdown {
            font-size: 22px;
            font-weight: bold;
            color: #00e676;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <h1>AI_KhangPhan đang sửa chữa</h1>
        <p>Hệ thống đang tạm ngưng dịch vụ để nâng cấp các tính năng mới tuyệt vời hơn. Vui lòng quay lại sau ít phút nữa nhé!</p>
        
        <!-- Đồng hồ đếm ngược thời gian -->
        <div id="countdown">Đang tải thời gian...</div>
    </div>

    <script>
        // Cài đặt thời gian đếm ngược (Ví dụ: đếm ngược 2 tiếng kể từ lúc truy cập)
        var countDownDate = new Date().getTime() + (2 * 60 * 60 * 1000);

        var x = setInterval(function() {
            var now = new Date().getTime();
            var distance = countDownDate - now;

            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Hiển thị kết quả ra thẻ div có id="countdown"
            document.getElementById("countdown").innerHTML = "Mở lại sau: " + hours + "h " + minutes + "m " + seconds + "s ";

            // Nếu hết giờ đếm ngược
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "Hệ thống sắp sửa trở lại!";
            }
        }, 1000);
    </script>

</body>
</html>
