<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI_KhangPhan - Đang bảo trì</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .maintenance-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #ffc107;
            margin-bottom: 15px;
            font-size: 26px;
        }
        p {
            color: #cfd8dc;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        
        /* Giao diện các ô đồng hồ 4 khối */
        #countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .countdown-block {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 70px;
        }
        .countdown-number {
            font-size: 36px;
            font-weight: bold;
            color: #00e676;
            display: block;
        }
        .countdown-label {
            font-size: 12px;
            color: #cfd8dc;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <h1>AI_KhangPhan đang sửa chữa</h1>
        <p>Hệ thống đang tạm ngưng dịch vụ để nâng cấp các tính năng mới tuyệt vời hơn. Vui lòng quay lại sau ít phút nữa nhé!</p>
        
        <!-- Giao diện hiển thị Ngày, Giờ, Phút, Giây -->
        <div id="countdown">
            <div class="countdown-block"><span id="days" class="countdown-number">00</span><span class="countdown-label">Ngày</span></div>
            <div class="countdown-block"><span id="hours" class="countdown-number">00</span><span class="countdown-label">Giờ</span></div>
            <div class="countdown-block"><span id="minutes" class="countdown-number">00</span><span class="countdown-label">Phút</span></div>
            <div class="countdown-block"><span id="seconds" class="countdown-number">00</span><span class="countdown-label">Giây</span></div>
        </div>
    </div>

    <script>
        // ========================================================
        // MẸO: Mỗi lần muốn đổi thời gian bảo trì mới, ông chỉ cần đổi 
        // chữ "maintenance_end_v2" thành "_v3", "_v4"... ở 2 chỗ dưới đây 
        // là web tự hiểu và không bị dính cache cũ!
        // ========================================================
        var cacheKey = "maintenance_end_v1";
        var countDownDate = localStorage.getItem(cacheKey);
        
        if (!countDownDate) {
            // Đặt thời gian bảo trì (Ví dụ: 30 phút = 30 * 60 * 1000)
            // Hoặc nếu muốn 2 ngày: ( 10 * 60 * 1000)
            countDownDate = new Date().getTime() + (10 * 60 * 1000);
            localStorage.setItem(cacheKey, countDownDate);
        }
        // --- TỰ ĐỘNG KIỂM TRA VÀ F5 KHI SERVER CÓ THAY ĐỔI ---
let lastTimeValue = null;

setInterval(function() {
    fetch('/check-maintenance')
        .then(response => response.json())
        .then(data => {
            if (lastTimeValue === null) {
                lastTimeValue = data.is_maintenance;
                return;
            }

            // Nếu trạng thái bảo trì trên server thay đổi, tự động F5 ngay
            if (data.is_maintenance !== lastTimeValue) {
                console.log("Phát hiện thay đổi từ server, đang tự động tải lại trang...");
                location.reload(); 
            }
        })
        .catch(error => console.log('Lỗi kết nối kiểm tra:', error));
}, 5000); // Check mỗi 5 giây

        var x = setInterval(function() {
            var now = new Date().getTime();
            var distance = countDownDate - now;

            // Tính toán thời gian
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Hàm tự động thêm số 0 đằng trước cho đẹp
            function pad(number) {
                return (number < 10 ? "0" : "") + number;
            }
            var now = new Date().getTime();
            var distance = countDownDate - now;

            // Nếu thời gian đếm ngược đã chạy về 0 hoặc âm (hết giờ)
            if (distance < 0) {
                // Tự động cộng thêm 5 phút (5 * 60 * 1000) vào mốc thời gian mới
                countDownDate = new Date().getTime() + (5 * 60 * 1000);
                localStorage.setItem(cacheKey, countDownDate); // Lưu lại mốc mới
                distance = countDownDate - now;
                var now = new Date().getTime();
                var distance = countDownDate - now;

                // Nếu đã chạy hết thời gian đếm ngược
                if (distance < 0) {
                clearInterval(x); // Dừng đồng hồ lại
    
                // Xóa bộ nhớ cache bảo trì cũ đi để lần sau vào không bị kẹt nữa
                localStorage.removeItem(cacheKey);

                // Tự động chuyển hướng về trang đăng nhập hoặc trang chính của ông
                window.location.href = "/login"; // Hoặc đường dẫn trang chính của ông (ví dụ: "/" hoặc "/chat")
}
}

            // Đẩy dữ liệu ra các ô giao diện
            document.getElementById("days").innerHTML = pad(days);
            document.getElementById("hours").innerHTML = pad(hours);
            document.getElementById("minutes").innerHTML = pad(minutes);
            document.getElementById("seconds").innerHTML = pad(seconds);

            // Xử lý khi hết giờ bảo trì
            if (distance < 0) {
                clearInterval(x);
                localStorage.removeItem(cacheKey);
                document.getElementById("countdown").innerHTML = '<div class="countdown-block" style="min-width: 300px;"><span class="countdown-number" style="font-size: 24px; color: #ff9800;">Hệ thống sắp sửa trở lại!</span></div>';
                
                setTimeout(function() {
                    location.reload();
                }, 3000);
            }
        }, 1000);
    </script>

</body>
</html>
