<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI_KhangPhan - Đang bảo trì</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .maintenance-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #ffc107;
            margin-bottom: 15px;
            font-size: 26px;
        }
        p {
            color: #cfd8dc;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        
        #countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .countdown-block {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 70px;
        }
        .countdown-number {
            font-size: 36px;
            font-weight: bold;
            color: #00e676;
            display: block;
        }
        .countdown-label {
            font-size: 12px;
            color: #cfd8dc;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <h1>AI_KhangPhan đang sửa chữa</h1>
        <p>Hệ thống đang tạm ngưng dịch vụ để nâng cấp các tính năng mới tuyệt vời hơn. Vui lòng quay lại sau:</p>
        
        <!-- Giao diện hiển thị Ngày, Giờ, Phút, Giây -->
        <div id="countdown">
            <div class="countdown-block"><span id="days" class="countdown-number">00</span><span class="countdown-label">Ngày</span></div>
            <div class="countdown-block"><span id="hours" class="countdown-number">00</span><span class="countdown-label">Giờ</span></div>
            <div class="countdown-block"><span id="minutes" class="countdown-number">00</span><span class="countdown-label">Phút</span></div>
            <div class="countdown-block"><span id="seconds" class="countdown-number">00</span><span class="countdown-label">Giây</span></div>
        </div>
        <p style="position: absolute; bottom: 15px; left: 0; right: 0; font-size: 11px; color: #888; margin: 0; text-align: center; letter-spacing: 0.5px;">
            Một sản phẩm được phát triển bởi Khang Phan (Phan Tăng Hoàng Khang).
        </p>
    </div>

    <script>
        // Biến lưu thời gian kết thúc đồng bộ từ Server
        let countDownDate = null;

        // Hàm thêm số 0 đằng trước cho đẹp
        function pad(number) {
            return (number < 10 ? "0" : "") + number;
        }

        // Lấy thời gian kết thúc bảo trì chuẩn từ server (hoặc fallback tạm thời nếu chưa có API backend)
        function fetchMaintenanceEndTime() {
            fetch('/check-maintenance')
                .then(response => response.json())
                .then(data => {
                    // Nếu server trả về cờ tắt bảo trì hoàn toàn
                    if (data.is_maintenance === false) {
                        window.location.href = "/";
                        return;
                    }

                    // Nếu server có cung cấp mốc thời gian kết thúc cụ thể (ví dụ: data.end_time dạng timestamp)
                    if (data.end_time) {
                        countDownDate = data.end_time;
                    } else if (!countDownDate) {
                        // Fallback mặc định 2 tiếng tính từ lúc vào nếu server chưa cấu hình end_time riêng
                        countDownDate = new Date().getTime() + ( 24 * 60 * 60 * 1000 );
                        //sửa TG ở đayyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
                    }
                })
                .catch(error => {
                    console.log('Lỗi kết nối kiểm tra:', error);
                    if (!countDownDate) {
                        countDownDate = new Date().getTime() + (2 * 60 * 60 * 1000);
                    }
                });
        }

        // Gọi ngay lần đầu tiên khi tải trang
        fetchMaintenanceEndTime();

        // Chạy đồng hồ đếm ngược mỗi giây
        var x = setInterval(function() {
            if (!countDownDate) return;

            var now = new Date().getTime();
            var distance = countDownDate - now;

            // Tính toán thời gian
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Đẩy dữ liệu ra các ô giao diện
            document.getElementById("days").innerHTML = pad(days > 0 ? days : 0);
            document.getElementById("hours").innerHTML = pad(hours > 0 ? hours : 0);
            document.getElementById("minutes").innerHTML = pad(minutes > 0 ? minutes : 0);
            document.getElementById("seconds").innerHTML = pad(seconds > 0 ? seconds : 0);

            // Xử lý khi đồng hồ chạy về 0 (Hết giờ bảo trì)
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = '<div class="countdown-block" style="min-width: 300px;"><span class="countdown-number" style="font-size: 20px; color: #ff9800;">Hệ thống sắp sửa trở lại!</span></div>';
                
                setTimeout(function() {
                    window.location.href = "/"; 
                }, 3000);
            }
        }, 1000);

        // Đồng bộ ngầm trạng thái với server mỗi 5 giây
        setInterval(fetchMaintenanceEndTime, 5000);
    </script>

</body>
</html>
