<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - AI KhangPhan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-bottom: 8px;
            color: #38bdf8;
            font-size: 24px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #f8fafc;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .login-btn {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: none;
            width: 100%;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }
        .login-btn:hover {
            background-color: #0ea5e9;
        }
        .error-msg {
            background-color: rgba(239, 68, 68, 0.1);
            border-left: 4px solid #ef4444;
            color: #fca5a5;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
        }
        .footer-link {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
        .footer-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Đăng Ký Tài Khoản</h2>
        <p class="subtitle">Tạo tài khoản mới để trải nghiệm AI KhangPhan</p>

        <!-- Hiển thị lỗi từ backend nếu có -->
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <!-- Form Đăng ký -->
        <form action="/register" method="POST">
            <div class="form-group">
                <label for="username">Tên đăng nhập hoặc Email</label>
                <input type="text" id="username" name="username" required placeholder="Nhập tài khoản của bạn">
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu">
            </div>
            <button type="submit" class="login-btn">Đăng Ký</button>
        </form>

        <div class="footer-link">
            Đã có tài khoản? <a href="/login-page">Đăng nhập ngay</a>
        </div>
    </div>
</body>
</html>
